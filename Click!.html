<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click!</title>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:#fff;color:#4a4545;font-family:"Dosis","Trebuchet MS",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;--mx:0;--my:0;
 background:linear-gradient(90deg,#ebebeb 0%,#f7f7f7 35%,#fff 62%)}
.d{position:absolute}
.c{border-radius:50%;background:radial-gradient(circle at 72% 38%,#fff 35%,#f1f1f1 70%,#dcdcdc 100%);
 box-shadow:0 18px 50px rgba(0,0,0,.09),inset -14px -10px 40px rgba(0,0,0,.05)}
.c1{--k:6;width:19vmax;height:19vmax;left:-6vmax;top:-9vmax;background:radial-gradient(circle at 70% 70%,#f4f4f4 30%,#cfcfcf 100%)}
.c2{--k:10;width:34vmax;height:34vmax;left:-17vmax;top:16vh}
.c3{--k:14;width:42vmax;height:42vmax;left:6vmax;top:42vh}
.c4{--k:8;width:28vmax;height:28vmax;left:12vmax;top:76vh}
.fl{--k:-12;pointer-events:none}
.fl img{display:block;width:100%;height:auto;mix-blend-mode:multiply}
.f1{right:-3vw;top:-2vw;width:min(47vw,700px)}
.f2{right:0;bottom:0;width:min(43vw,620px)}
.hero{position:absolute;left:0;top:0;right:0;bottom:0;display:grid;place-items:center;pointer-events:none}
.btn{pointer-events:auto;position:relative;border:0;cursor:pointer;font:italic 400 clamp(28px,3.4vw,40px)/1 "Dosis",sans-serif;
 color:#fff;background:#9b9293;padding:.62em 1.55em;border-radius:.62em;letter-spacing:.01em;
 transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,opacity .4s,box-shadow .3s}
.btn:hover{background:#8b8283;transform:translateY(-3px);box-shadow:0 14px 28px rgba(80,70,70,.22)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.tab:focus-visible,.back:focus-visible,.next:focus-visible,.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.back,.next{border:0;background:none;color:#7a7172;font:italic 400 18px "Dosis",sans-serif;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
.next{margin-left:auto}
.back[hidden],.next[hidden]{display:none}
.next[hidden]{display:none}
.next[hidden]{display:none}
.next:hover{background:#8b8283;transform:translateY(-2px)}
.next[hidden]{display:none}
.open .btn{opacity:0;transform:scale(.6);pointer-events:none}
.panel{position:absolute;left:50%;top:50%;width:min(88vw,520px);opacity:0;visibility:hidden;
 transform:translate(-50%,-46%) scale(.94);transition:all .6s cubic-bezier(.2,.8,.2,1);
 background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 border-radius:28px;padding:clamp(22px,4vw,38px);box-shadow:0 30px 70px rgba(60,50,50,.14)}
.open .panel{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);transition-delay:.15s}
.panel h1{margin:0 0 .25em;font:italic 400 clamp(34px,5vw,50px)/1.05 "Dosis",sans-serif}
.tabs{display:flex;gap:8px;margin:18px 0 16px;flex-wrap:wrap}
.tab{border:1.5px solid #9b9293;background:transparent;color:#6d6566;border-radius:99px;padding:.4em 1.1em;font:italic 400 19px "Dosis",sans-serif;cursor:pointer;transition:.25s}
.tab[aria-selected=true]{background:#9b9293;color:#fff}
.body{font-size:19px;line-height:1.55;font-weight:400;min-height:6.2em;margin:0;color:#4a4545}
.back{margin-top:18px;border:0;background:none;color:#7a7172;font:italic 400 18px "Dosis",sans-serif;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
.petal{position:fixed;width:10px;height:16px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:#c9c3c4;opacity:.9;pointer-events:none;z-index:9}
@media (max-width:640px){.f1{width:62vw}.f2{width:72vw}.c3{left:-6vmax}}
@media (prefers-reduced-motion:reduce){.panel,.btn{transition:none}}
</style></head>

<script>
const stage=document.getElementById('stage'),go=document.getElementById('go'),next=document.getElementById('next'),back=document.getElementById('back');
const panel=document.getElementById('panel'),body=document.getElementById('body');
const text=[
"Hi Baabaa! Im so sorry medyo natagalan ako mag ask sayo na manligaw ako i've been doing this website kasi hehe syempre as a cs student i want it to make it special yung magiging memorable sayo buong buhay mo. but first i just wanna thank you cause you bring so much joy in my life to the point na niligtas mo ako mismo sa downfall ng buhay ko ( nasabi ko na yan sayo hehe) sobrang thankful ako dumating ka sa buhay ko and sobrang unexpected lahat ng nangyayari kahit ako di mapakaniwala na nangyayari lahat ng to also di ko rin expected na gagawa ako ng ganto im so so grateful to have you my baabaa it may sound cringe pero wala e yun yung gusto ko sabihin sayo "
,"hi"];
let page=0;
function render(){body.textContent=text[page];back.hidden=page===0;next.hidden=page===text.length-1}
render();
function turn(dir,btn){
 const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
 const rest='translate(-50%,-50%) scale(1)';
 const outX=dir>0?'-62%':'-38%',inX=dir>0?'-38%':'-62%';
 const out=panel.animate([{opacity:1,transform:rest},{opacity:0,transform:`translate(${outX},-50%) scale(.94)`}],{duration:350,easing:'ease-in',fill:'forwards'});
 out.onfinish=()=>{page+=dir;render();out.cancel();
  panel.animate([{opacity:0,transform:`translate(${inX},-50%) scale(.94)`},{opacity:1,transform:rest}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'});
  (dir>0&&!next.hidden?next:back.hidden?next:back).focus()};
}
next.onclick=()=>turn(1,next);
back.onclick=()=>turn(-1,back);
go.onclick=e=>{const r=go.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
 stage.classList.add('open');setTimeout(()=>next.focus(),500)};
function show(i){tabs.forEach((t,j)=>t.setAttribute('aria-selected',j==i));body.textContent=text[i]}
tabs.forEach(t=>t.onclick=()=>show(+t.dataset.i));show(0);
function burst(x,y){
 for(let i=0;i<16;i++){
  const p=document.createElement('span');p.className='petal';p.style.left=x+'px';p.style.top=y+'px';
  document.body.appendChild(p);
  const a=Math.random()*Math.PI*2,d=70+Math.random()*130;
  p.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:.9},
   {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+90}px) rotate(${Math.random()*540}deg) scale(.4)`,opacity:0}],
   {duration:1100+Math.random()*600,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove()}}
go.onclick=e=>{const r=go.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
 stage.classList.add('open');setTimeout(()=>document.querySelector('.tab').focus(),500)};
back.onclick=()=>{stage.classList.remove('open');setTimeout(()=>go.focus(),400)};
</script></body></html>
